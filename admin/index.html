<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Cooks — Admin (Creator Studio)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:620px;margin:24px auto;padding:0 16px;color:#2a201d}
h1{color:#7a2e2e} input,button,select{font-size:15px;padding:9px;margin:4px 0;width:100%;box-sizing:border-box}
button{background:#7a2e2e;color:#fff;border:none;border-radius:8px;cursor:pointer;width:auto;padding:10px 16px}
.card{border:1px solid #e7d8d0;border-radius:12px;padding:16px;margin:14px 0}
.muted{color:#8a7c76;font-size:13px} .ok{color:#2f9e44}.err{color:#c0392b}
</style></head><body>
<h1>Macro Cooks — Creator Studio (Admin)</h1>
<p class="muted">Test console for the backend. Log in with an <b>admin</b> account, upload a video to Cloudflare Stream, then publish it.</p>

<div class="card"><b>1. Log in</b>
<input id="email" placeholder="admin email">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Log in</button> <span id="loginMsg" class="muted"></span></div>

<div class="card"><b>2. Upload a video</b>
<input id="file" type="file" accept="video/*">
<button onclick="upload()">Upload to Cloudflare Stream</button>
<div id="uploadMsg" class="muted"></div></div>

<div class="card"><b>3. Publish the class</b>
<input id="title" placeholder="Title (e.g. Perfect pilau in 30 min)">
<input id="chef" placeholder="Chef / author">
<select id="premium"><option value="false">Free</option><option value="true">Premium</option></select>
<button onclick="publish()">Publish to Learn</button>
<div id="publishMsg" class="muted"></div></div>

<div class="card"><b>Published classes</b> <button onclick="loadClasses()">Refresh</button>
<div id="list"></div></div>

<script>
/* The publish call used to send chef / is_premium / stream_uid. The API reads title / by /
   free / uid, so every publish came back 400 and no class could ever go live. The names
   below are the ones the API actually reads. The class list also used to be fetched with no
   Authorization header against an endpoint that requires one, which is why it always said
   "None yet" however many classes existed. */
let token = '', uid = '', busy = false;

const api = (p, o = {}) => fetch(p, Object.assign({}, o, {
  headers: Object.assign({ 'Content-Type': 'application/json' },
    token ? { Authorization: 'Bearer ' + token } : {}, o.headers || {})
}));
const say = (el, text, cls) => { el.textContent = text; el.className = cls || 'muted'; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function readJson(r) {
  try { return await r.json(); }
  catch (e) { return { error: 'the server answered ' + r.status + ' and not JSON' }; }
}

async function login() {
  const r = await api('/api/auth/login', { method: 'POST',
    body: JSON.stringify({ email: email.value, password: password.value }) });
  const j = await readJson(r);
  if (!r.ok || !j.token) { say(loginMsg, j.error || ('Login failed (' + r.status + ')'), 'err'); return; }
  token = j.token;
  if (j.user && j.user.role !== 'admin') {
    say(loginMsg, 'Signed in, but this account is not an admin, so publishing will be refused.', 'err');
  } else {
    say(loginMsg, 'Signed in as admin.', 'ok');
  }
  loadClasses();
}

async function upload() {
  if (busy) return;
  if (!token) { say(uploadMsg, 'Log in first', 'err'); return; }
  if (!file.files[0]) { say(uploadMsg, 'Pick a file first', 'err'); return; }
  busy = true; uid = '';
  say(uploadMsg, 'Asking Cloudflare for an upload link...');
  try {
    const r = await api('/api/content/admin/upload-url', { method: 'POST' });
    const j = await readJson(r);
    if (!r.ok || !j.uploadURL) {
      say(uploadMsg, 'Could not get an upload link: ' + (j.error || r.status) +
        '. Check that CF_ACCOUNT_ID and CF_STREAM_TOKEN are set in Render.', 'err');
      return;
    }
    say(uploadMsg, 'Uploading to Cloudflare. A long video can take a while.');
    const fd = new FormData(); fd.append('file', file.files[0]);
    const up = await fetch(j.uploadURL, { method: 'POST', body: fd });
    if (!up.ok) { say(uploadMsg, 'Cloudflare refused the upload (' + up.status + ')', 'err'); return; }
    uid = j.uid;
    say(uploadMsg, 'Uploaded. Cloudflare still has to process it, which can take a few ' +
      'minutes before it will play. Video id ' + uid, 'ok');
  } catch (e) {
    say(uploadMsg, 'Upload failed: ' + (e.message || e), 'err');
  } finally { busy = false; }
}

async function publish() {
  if (!uid) { say(publishMsg, 'Upload a video first', 'err'); return; }
  if (!title.value.trim()) { say(publishMsg, 'Give the class a title', 'err'); return; }
  const body = {
    title: title.value.trim(),
    by: chef.value.trim(),
    free: premium.value !== 'true',
    uid: uid
  };
  const r = await api('/api/content/admin/classes', { method: 'POST', body: JSON.stringify(body) });
  const j = await readJson(r);
  if (!r.ok || !j.ok) { say(publishMsg, j.error || ('Publish failed (' + r.status + ')'), 'err'); return; }
  say(publishMsg, 'Published.', 'ok');
  uid = ''; title.value = ''; chef.value = '';
  loadClasses();
}

async function loadClasses() {
  if (!token) { list.innerHTML = '<span class="muted">Log in to see what is published.</span>'; return; }
  const r = await api('/api/content/classes');
  const j = await readJson(r);
  if (!r.ok) {
    list.innerHTML = '<span class="err">Could not load the list: ' + esc(j.error || r.status) + '</span>';
    return;
  }
  const rows = j.classes || [];
  list.innerHTML = rows.length
    ? rows.map(c => '<div>' + (c.free ? '' : 'Premium. ') + esc(c.title) +
        ' <span class="muted">' + esc(c.by || '') + '</span></div>').join('')
    : '<span class="muted">Nothing published yet.</span>';
}

loadClasses();
</script></body></html>
